<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hati's World — World Cup Predictions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a6b3c;--green-light:#22884e;--green-dark:#0f4226;
  --gold:#f5c518;--gold-dark:#c9a010;
  --bg:#0a1a0f;--surface:#0f2318;--surface2:#162e1e;--surface3:#1d3d28;
  --text:#e8f5ee;--text2:#9cbfaa;--text3:#5d8a6e;
  --border:#2a4a35;--danger:#e05252;--danger2:#c23a3a;
  --radius:10px;--radius-lg:16px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px}
input,select,textarea{background:var(--surface3);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:9px 12px;font-size:14px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus{border-color:var(--green-light)}
button{cursor:pointer;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;padding:10px 18px;transition:all .15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-light)}
.btn-secondary{background:var(--surface3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface2)}
.btn-gold{background:var(--gold);color:#1a1a00;font-weight:700}
.btn-gold:hover{background:var(--gold-dark)}
.btn-danger{background:var(--danger2);color:#fff}
.btn-danger:hover{background:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#1a6b3c33;color:#6ed4a0;border:1px solid #2a6b4080}
.badge-gold{background:#f5c51822;color:var(--gold);border:1px solid var(--gold-dark)}
.badge-red{background:#e0525222;color:#f08080;border:1px solid var(--danger2)}
.tab-bar{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:var(--radius-lg);border:1px solid var(--border)}
.tab{flex:1;padding:8px 4px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{background:var(--green);color:#fff}
.flag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;max-height:250px;overflow-y:auto;padding:4px}
.flag-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;font-size:11px;color:var(--text2);text-align:center;user-select:none}
.flag-opt:hover{background:var(--surface3);border-color:var(--border)}
.flag-opt.selected{background:var(--surface3);border-color:var(--green-light);color:var(--text)}
.flag-emoji{font-size:28px;line-height:1.2}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:.75rem;transition:border .15s}
.match-card:hover{border-color:var(--green)}
.match-teams{display:flex;align-items:stretch;justify-content:space-between;gap:8px}
.team-pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;font-size:13px;font-weight:600;text-align:center;user-select:none}
.team-pick:hover{background:var(--surface3)}
.team-pick.chosen{border-color:var(--green-light);background:#1a6b3c22}
.team-pick.locked{cursor:default;opacity:.8}
.team-pick.locked:hover{background:transparent}
.vs-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex-shrink:0}
.vs-badge{font-size:11px;font-weight:700;color:var(--text3);padding:4px 8px;background:var(--surface3);border-radius:6px}
.draw-pick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .15s;font-size:12px;font-weight:600;user-select:none}
.draw-pick:hover{background:var(--surface3)}
.draw-pick.chosen{border-color:var(--green-light);background:#1a6b3c22}
.draw-pick.locked{cursor:default;opacity:.8}
.draw-pick.locked:hover{background:transparent}
.odds-display{font-size:11px;color:var(--gold);font-weight:700}
.bet-row{display:flex;gap:6px;align-items:center;margin-top:.75rem;flex-wrap:wrap}
.bet-row input{width:120px;flex-shrink:0}
.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:var(--surface3);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--green-light);color:var(--text)}
.result-badge{padding:3px 8px;border-radius:6px;font-size:12px;font-weight:700;display:inline-block}
.won{background:#1a6b3c33;color:#6ed4a0}
.lost{background:#e0525222;color:#f08080}
.pending{background:#f5c51822;color:var(--gold)}
.section-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:12px}
.scroll-y{overflow-y:auto;max-height:420px;padding-right:4px}
.scroll-y::-webkit-scrollbar{width:4px}
.scroll-y::-webkit-scrollbar-track{background:transparent}
.scroll-y::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.modal-overlay{position:fixed;inset:0;background:#00000095;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.error-msg{color:#f08080;font-size:13px;margin-top:6px;min-height:18px}
.profit{color:#6ed4a0}
.loss{color:#f08080}
.header{background:linear-gradient(135deg,var(--green-dark) 0%,var(--surface) 100%);padding:14px 16px;border-bottom:1px solid var(--border)}
.header-inner{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.main{max-width:820px;margin:0 auto;padding:16px}
.title-top{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:2px}
.game-subtitle{font-size:clamp(18px,4vw,28px);font-weight:800;color:var(--green-light);line-height:1;margin-top:2px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface3);border:1.5px solid var(--border);flex-shrink:0;user-select:none}
.leader-row{display:flex;align-items:center;gap:12px;padding:.75rem 1rem;border-radius:var(--radius);background:var(--surface2);margin-bottom:6px;transition:border .15s}
.leader-rank{font-size:17px;font-weight:700;width:34px;color:var(--text3);text-align:center}
.leader-rank.top1{color:var(--gold)}
.leader-rank.top2{color:#aaa}
.leader-rank.top3{color:#cd7f32}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media(max-width:520px){
  .match-teams{flex-direction:column}
  .team-pick{flex-direction:row;justify-content:flex-start;gap:10px}
  .vs-col{flex-direction:row;justify-content:center}
  .tab{font-size:11px;padding:7px 2px}
  .header-inner{gap:8px}
  .bet-row input{width:100px}
}
</style>
</head>

// Betting locks at kickoff; expired = kicked off but no result yet
function isExpired(m){ return m.ts && Date.now() >= m.ts && m.result === null; }
function isSettled(m){ return m.result !== null; }
function loadDB(){
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    if(d) return JSON.parse(d);
  } catch(e){}
  return {users:{}, matches: JSON.parse(JSON.stringify(DEFAULT_MATCHES))};
}
function saveDB(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){} }

function saveSession(username){ try{ localStorage.setItem(SESSION_KEY, username||''); }catch(e){} }
function loadSession(){ try{ return localStorage.getItem(SESSION_KEY)||null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

  t.textContent = msg;

}

function renderMatchCard(m, u) {
  const bet = u.bets.find(b => b.matchId === m.id);
  const settled = isSettled(m);
  const expired = isExpired(m);
  const locked = settled || expired || !!bet;
  const pp = pendingPicks[m.id];
  const dimStyle = expired ? 'opacity:0.55;' : '';
  return `
  <div class="match-card" id="mc-${m.id}" style="${dimStyle}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:4px">
      <span class="badge badge-green">${m.stage}</span>
      <span style="font-size:12px;color:var(--text3)">${m.date}</span>
      ${settled ? `<span class="badge badge-gold">Settled: ${m.result==='home'?m.home:m.result==='away'?m.away:'Draw'}</span>` : ''}
      ${expired ? `<span class="badge badge-red">🔒 Betting Closed</span>` : ''}
    </div>
    <div class="match-teams">
      <div class="team-pick ${bet&&bet.pick==='home'?'chosen':''} ${pp==='home'&&!bet?'chosen':''} ${locked?'locked':''}"
        data-match="${m.id}" data-pick="home">
        <span style="font-size:32px">${m.homeFlag}</span>
        <span>${m.home}</span>
        <span class="odds-display">×${m.homeOdds}</span>
      </div>
      <div class="vs-col">
        <div class="vs-badge">VS</div>
        <div class="draw-pick ${bet&&bet.pick==='draw'?'chosen':''} ${pp==='draw'&&!bet?'chosen':''} ${locked?'locked':''}"
          data-match="${m.id}" data-pick="draw">
          <span style="font-size:11px">Draw</span>
          <span class="odds-display">×${m.drawOdds}</span>
        </div>
      </div>
      <div class="team-pick ${bet&&bet.pick==='away'?'chosen':''} ${pp==='away'&&!bet?'chosen':''} ${locked?'locked':''}"
        data-match="${m.id}" data-pick="away">
        <span style="font-size:32px">${m.awayFlag}</span>
        <span>${m.away}</span>
        <span class="odds-display">×${m.awayOdds}</span>
      </div>
    </div>
    ${bet ? `
      <div style="margin-top:10px;padding:8px 12px;background:var(--surface3);border-radius:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;flex-wrap:wrap;gap:6px">
        <span>Pick: <b>${bet.pick==='home'?m.home:bet.pick==='away'?m.away:'Draw'}</b> · 🪙 ${bet.amount}</span>
        ${settled
          ? `<span class="result-badge ${bet.pick===m.result?'won':'lost'}">${bet.pick===m.result?'✅ Won':'❌ Lost'}</span>`
          : expired
            ? `<span class="result-badge pending">⏳ Awaiting result</span>`
            : `<span class="result-badge pending">⏳ Pending</span>`}
      </div>` : expired ? `
      <div style="margin-top:8px;font-size:12px;color:var(--text3);text-align:center;padding:4px">
        This match has started — betting is closed.
      </div>` : `
      <div id="bet-row-${m.id}" style="display:${pp?'flex':'none'}" class="bet-row">
        <input type="number" id="bet-amt-${m.id}" min="10" max="${u.coins}" step="10" placeholder="Amount" style="width:110px">
        <div class="chip-row">
          <span class="chip" data-match="${m.id}" data-chip="100">100</span>
          <span class="chip" data-match="${m.id}" data-chip="250">250</span>

function renderPredict(){
  const u = getUser();
  const now = Date.now();
  const upcoming = DB.matches.filter(m => !isSettled(m) && !isExpired(m));
  const expired  = DB.matches.filter(m => isExpired(m));
  const settled  = DB.matches.filter(m => isSettled(m));

  return `
  <div>
    ${upcoming.length === 0 && expired.length === 0 && settled.length === 0
      ? `<div class="card" style="text-align:center;padding:2.5rem;color:var(--text2)">
           <div style="font-size:40px;margin-bottom:12px">⚽</div>
           No matches loaded yet.
         </div>`
      : ''}

    ${upcoming.length > 0 ? `
    <div class="section-title">Upcoming Matches</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Pick a winner (or draw) then enter your wager. Odds = your payout multiplier.</p>
    <div class="scroll-y" style="max-height:none">
      ${upcoming.map(m => renderMatchCard(m, u)).join('')}
    </div>` : ''}

    ${settled.length > 0 ? `
    <div class="section-title" style="margin-top:20px">✅ Settled Matches</div>
    <div class="scroll-y">
      ${settled.map(m => renderMatchCard(m, u)).join('')}
    </div>` : ''}

    ${expired.length > 0 ? `
    <div class="section-title" style="margin-top:20px;color:var(--danger)">🔒 Betting Closed</div>
    <p style="font-size:12px;color:var(--text3);margin-bottom:10px">These matches have kicked off — awaiting results from the Simulate tab.</p>
    <div class="scroll-y">
      ${expired.map(m => renderMatchCard(m, u)).join('')}
    </div>` : ''}
  </div>`;
}

function renderMyBets(){
  const u = getUser();
  if(!u.bets.length) return `<div class="card" style="text-align:center;padding:2.5rem;color:var(--text2)">
    <div style="font-size:40px;margin-bottom:12px">🎯</div>
    No bets yet — head to the Predict tab to get started!
  </div>`;
  let netProfit=0, atStake=0;
  const rows = u.bets.map(b => {
    const m = DB.matches.find(x=>x.id===b.matchId);
    if(!m) return '';
    const odds = b.pick==='home'?m.homeOdds:b.pick==='away'?m.awayOdds:m.drawOdds;
    const payout = Math.floor(b.amount*odds);
    const profit = payout - b.amount;
    const won = m.result && m.result===b.pick;
    const lost = m.result && m.result!==b.pick;
    if(won) netProfit += profit;
    if(lost) netProfit -= b.amount;
    if(!m.result) atStake += b.amount;
    return `
    <div style="padding:.75rem;background:var(--surface2);border-radius:var(--radius);margin-bottom:6px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:160px">
        <div style="font-weight:600;font-size:14px">${m.homeFlag} ${m.home} vs ${m.away} ${m.awayFlag}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${m.stage} · ${m.date}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">
          Pick: <b style="color:var(--text)">${b.pick==='home'?m.home:b.pick==='away'?m.away:'Draw'}</b>
          · Odds: <span style="color:var(--gold)">×${odds.toFixed(1)}</span>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:14px;font-weight:700">🪙 ${b.amount}</div>
        ${m.result
          ? `<div style="font-size:12px;margin-top:2px" class="${won?'profit':'loss'}">${won?'+'+profit:'-'+b.amount}</div>`
          : `<div style="font-size:12px;color:var(--text3);margin-top:2px">win +${profit}</div>`}
        <span class="result-badge ${won?'won':lost?'lost':'pending'}" style="margin-top:4px">
          ${won?'✅ Won':lost?'❌ Lost':'⏳ Pending'}
        </span>
      </div>
    </div>`;
  }).join('');
  return `
  <div>
    <div class="section-title">My Bets</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      <div class="card" style="text-align:center;padding:.85rem">
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px">Net P&L</div>
        <div style="font-weight:700;font-size:18px" class="${netProfit>=0?'profit':'loss'}">${netProfit>=0?'+':'-'}🪙${Math.abs(netProfit)}</div>
      </div>
      <div class="card" style="text-align:center;padding:.85rem">
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px">At Stake</div>
        <div style="font-weight:700;font-size:18px;color:var(--gold)">🪙${atStake}</div>
      </div>
      <div class="card" style="text-align:center;padding:.85rem">
        <div style="font-size:11px;color:var(--text2);margin-bottom:4px">Total Bets</div>
        <div style="font-weight:700;font-size:18px">${u.bets.length}</div>
      </div>
    </div>
    <div class="scroll-y">${rows}</div>
  </div>`;
}

function renderLeaderboard(){
  const sorted = Object.values(DB.users).sort((a,b)=>b.coins-a.coins);
  const medals = ['🥇','🥈','🥉'];
  return `
  <div>
    <div class="section-title">🏅 Leaderboard</div>
    <div class="scroll-y">
    ${sorted.length===0 ? '<p style="color:var(--text2);text-align:center;padding:2rem">No players yet!</p>' : ''}
    ${sorted.map((u,i)=>`
      <div class="leader-row" style="${u.username===currentUser?'border:1.5px solid var(--green-light)':'border:1px solid transparent'}">
        <div class="leader-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${medals[i]||('#'+(i+1))}</div>
        <div class="avatar">${u.flag.flag}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
            ${u.username}${u.username===currentUser?' <span style="font-size:11px;color:var(--green-light)">(you)</span>':''}
          </div>
          <div style="font-size:12px;color:var(--text2)">${u.flag.name} · ${u.bets.length} bet${u.bets.length!==1?'s':''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-weight:700;color:var(--gold);font-size:17px">🪙 ${u.coins.toLocaleString()}</div>
          <div style="font-size:11px;color:var(--text3)">started 🪙1,000</div>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderAdmin(){
  return `
  <div>
    <div class="section-title">⚙️ Simulate Match Results</div>
    <p style="font-size:13px;color:var(--text2);margin-bottom:16px">
      Set the result of any match. Winning bettors automatically receive their payout. Losers forfeit their stake.
    </p>
    ${DB.matches.map(m => {
      const allBets = Object.values(DB.users).reduce((acc,u)=>acc+u.bets.filter(b=>b.matchId===m.id).length, 0);
      return `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:${m.result?'6px':'12px'}">
          <div>
            <div style="font-weight:700;font-size:15px">${m.homeFlag} ${m.home} <span style="color:var(--text3)">vs</span> ${m.away} ${m.awayFlag}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:3px">${m.stage} · ${m.date} · ${allBets} bet${allBets!==1?'s':''}</div>
          </div>
          ${m.result ? `<span class="badge badge-gold">Result set: ${m.result==='home'?m.home:m.result==='away'?m.away:'Draw'}</span>` : ''}

        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-primary" data-result-match="${m.id}" data-result-pick="home" style="flex:1;min-width:120px">${m.homeFlag} ${m.home} wins</button>
          <button class="btn-secondary" data-result-match="${m.id}" data-result-pick="draw" style="flex:1;min-width:80px">Draw</button>
          <button class="btn-primary" data-result-match="${m.id}" data-result-pick="away" style="flex:1;min-width:120px">${m.awayFlag} ${m.away} wins</button>

function renderPfpModal(){
  const u = getUser();
  const current = pfpPending || u.flag;
  return `
  <div class="modal-overlay" id="pfp-overlay">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h2 style="font-size:17px">Change profile flag</h2>
        <button class="btn-secondary" id="close-pfp" style="padding:5px 11px;font-size:13px">✕</button>
      </div>
      <input id="flag-search-pfp" placeholder="Search flags..." style="margin-bottom:10px">
      <div class="flag-grid" id="flag-grid-pfp">${renderFlagGrid(current, 'pfp')}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:8px;margin-bottom:14px">
        ${current ? 'Selected: '+current.flag+' '+current.name : 'None selected'}
      </div>
      <button class="btn-gold" id="save-pfp" style="width:100%">Save flag ✔</button>
    </div>
  </div>`;
}

// ─── BIND EVENTS ──────────────────────────────────────────────────────────
function bind(){
  const $ = id => document.getElementById(id);

  // auth tab switches
  el('tab-login') && el('tab-login').addEventListener('click', ()=>{ showModal=null; render(); });
  el('tab-reg') && el('tab-reg').addEventListener('click', ()=>{ showModal='register'; flagSearch=''; render(); });

  // login
  el('btn-login') && el('btn-login').addEventListener('click', doLogin);
  bindEnter(['l-user','l-pass'], doLogin);

  // register
  el('btn-reg') && el('btn-reg').addEventListener('click', doRegister);
  bindEnter(['r-user','r-pass'], doRegister);

  // flag search (register)
  el('flag-search-reg') && el('flag-search-reg').addEventListener('input', e=>{
    flagSearch = e.target.value;
    el('flag-grid-reg').innerHTML = renderFlagGrid(regSelectedFlag, 'reg');
  });

  // flag options (delegated)
  document.querySelectorAll('.flag-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      const scope = opt.dataset.scope;
      const name = opt.dataset.flag;
      const f = FLAGS.find(x=>x.name===name);
      if(scope==='reg'){
        regSelectedFlag = f;
        el('flag-grid-reg').innerHTML = renderFlagGrid(regSelectedFlag, 'reg');
        el('flag-sel-reg').textContent = f ? '✅ '+f.flag+' '+f.name : 'None';
      } else if(scope==='pfp'){
        pfpPending = f;
        el('flag-grid-pfp').innerHTML = renderFlagGrid(pfpPending, 'pfp');
        opt.closest('.modal').querySelector('[style*="font-size:12px"]').textContent =
          f ? 'Selected: '+f.flag+' '+f.name : 'None selected';
      }
    });
  });

  // game tabs
  document.querySelectorAll('[data-tab]').forEach(t=>{
    t.addEventListener('click', ()=>{ activeTab=t.dataset.tab; render(); });
  });

  // logout
  el('btn-logout') && el('btn-logout').addEventListener('click', ()=>{
    currentUser=null; activeTab='predict'; pendingPicks={}; showModal=null;
    clearSession(); render();
  });

  // change pfp link
  el('change-pfp-link') && el('change-pfp-link').addEventListener('click', ()=>{
    pfpPending=null; flagSearch=''; showModal='pfp'; render();
  });

  // pfp modal
  el('close-pfp') && el('close-pfp').addEventListener('click', ()=>{ showModal=null; render(); });
  el('pfp-overlay') && el('pfp-overlay').addEventListener('click', e=>{
    if(e.target===el('pfp-overlay')){ showModal=null; render(); }
  });
  el('flag-search-pfp') && el('flag-search-pfp').addEventListener('input', e=>{
    flagSearch = e.target.value;
    el('flag-grid-pfp').innerHTML = renderFlagGrid(pfpPending||getUser().flag, 'pfp');
  });
  el('save-pfp') && el('save-pfp').addEventListener('click', ()=>{
    if(!pfpPending){ showToast('Pick a flag first!'); return; }
    getUser().flag = pfpPending;
    pfpPending=null; flagSearch=''; showModal=null;
    saveDB(); showToast('Flag updated! '+getUser().flag.flag); render();
  });

  // team picks
  document.querySelectorAll('[data-pick]').forEach(tp=>{
    tp.addEventListener('click', ()=>{
      if(tp.classList.contains('locked')) return;
      const matchId = parseInt(tp.dataset.match||tp.closest('[data-match]')?.dataset.match||tp.dataset.match);
      const pick = tp.dataset.pick;
      if(!matchId) return;
      pendingPicks[matchId] = pick;
      // update UI without full re-render
      document.querySelectorAll(`[data-match="${matchId}"][data-pick]`).forEach(x=>x.classList.remove('chosen'));
      tp.classList.add('chosen');
      const row = el('bet-row-'+matchId);
      if(row) row.style.display='flex';
    });
  });

  // chips
  document.querySelectorAll('[data-chip]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const matchId = chip.dataset.match;
      const type = chip.dataset.chip;
      const inp = el('bet-amt-'+matchId);
      if(!inp) return;
      const coins = getUser().coins;
      if(type==='half') inp.value = Math.floor(coins/2);
      else if(type==='all') inp.value = coins;
      else inp.value = Math.min(parseInt(type), coins);
    });
  });

  // place bet
  document.querySelectorAll('[data-place]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ placeBet(parseInt(btn.dataset.place)); });
  });

  // cancel pick
  document.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.dataset.cancel);
      delete pendingPicks[id];
      document.querySelectorAll(`[data-match="${id}"][data-pick]`).forEach(x=>x.classList.remove('chosen'));
      const row = el('bet-row-'+id);
      if(row) row.style.display='none';
    });
  });

  // set result
  document.querySelectorAll('[data-result-match]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ setResult(parseInt(btn.dataset.resultMatch), btn.dataset.resultPick); });
  });

  // reset result
  document.querySelectorAll('[data-reset-match]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ resetResult(parseInt(btn.dataset.resetMatch)); });
  });
}

function el(id){ return document.getElementById(id); }
function bindEnter(ids, fn){ ids.forEach(id=>{ el(id) && el(id).addEventListener('keydown', e=>{ if(e.key==='Enter') fn(); }); }); }

// ─── ACTIONS ──────────────────────────────────────────────────────────────
function doLogin(){
  const u = (el('l-user')||{}).value||'';
  const p = (el('l-pass')||{}).value||'';
  const err = el('l-err');
  const key = u.toLowerCase().trim();
  if(!key){ if(err) err.textContent='Enter your username.'; return; }
  if(!DB.users[key]){ if(err) err.textContent='Username not found.'; return; }
  if(DB.users[key].password !== p){ if(err) err.textContent='Wrong password.'; return; }
  currentUser = key; activeTab='predict'; pendingPicks={};
  saveSession(key);
  showToast('Welcome back, '+DB.users[key].username+'! '+DB.users[key].flag.flag);
  render();
}

function doRegister(){
  const u = ((el('r-user')||{}).value||'').trim();
  const p = (el('r-pass')||{}).value||'';
  const err = el('r-err');
  if(u.length<3){ if(err) err.textContent='Username must be at least 3 characters.'; return; }
  if(!/^[a-zA-Z0-9_]+$/.test(u)){ if(err) err.textContent='Username: letters, numbers, underscores only.'; return; }
  if(p.length<4){ if(err) err.textContent='Password must be at least 4 characters.'; return; }
  if(!regSelectedFlag){ if(err) err.textContent='Please select a flag for your profile.'; return; }
  const key = u.toLowerCase();
  if(DB.users[key]){ if(err) err.textContent='That username is already taken.'; return; }
  DB.users[key] = {username:u, password:p, flag:regSelectedFlag, coins:1000, bets:[], joined:Date.now()};
  saveDB();
  currentUser = key; regSelectedFlag=null; flagSearch=''; activeTab='predict'; pendingPicks={};
  saveSession(key);
  showToast('Account created! You have 🪙 1,000 coins to start!');
  render();
}

function placeBet(matchId){
  const u = getUser();
  const pick = pendingPicks[matchId];
  if(!pick){ showToast('Pick a team or Draw first!'); return; }
  const inp = el('bet-amt-'+matchId);
  const amt = parseInt(inp?inp.value:0);
  if(!amt||amt<10){ showToast('Minimum bet is 🪙 10!'); return; }
  if(amt>u.coins){ showToast("You don't have enough coins!"); return; }
  const m = DB.matches.find(x=>x.id===matchId);
  if(!m || isExpired(m)){ showToast('Betting is closed for this match!'); return; }
  if(isSettled(m)){ showToast('This match is already settled!'); return; }
  u.coins -= amt;
  const odds = pick==='home'?m.homeOdds:pick==='away'?m.awayOdds:m.drawOdds;
  u.bets.push({matchId, pick, amount:amt, placed:Date.now()});
  delete pendingPicks[matchId];
  saveDB();
  showToast(`Bet placed! 🪙 ${amt} on ${pick==='home'?m.home:pick==='away'?m.away:'Draw'} at ×${odds}`);
  render();
}

function setResult(matchId, result){
  const m = DB.matches.find(x=>x.id===matchId);
  if(!m||m.result) return;
  m.result = result;
  let payouts = 0;
  Object.values(DB.users).forEach(u=>{
    u.bets.filter(b=>b.matchId===matchId).forEach(b=>{
      if(b.pick===result){
        const odds = b.pick==='home'?m.homeOdds:b.pick==='away'?m.awayOdds:m.drawOdds;
        const payout = Math.floor(b.amount*odds);
        u.coins += payout;
        payouts++;
      }
    });
  });
  saveDB();
  showToast(`Result set! ${result==='home'?m.home:result==='away'?m.away:'Draw'} wins. ${payouts} payout${payouts!==1?'s':''} issued.`);
  render();
}

function resetResult(matchId){
  if(!confirm('Reset this result? Note: payouts already issued will NOT be reversed.')) return;
  const m = DB.matches.find(x=>x.id===matchId);
  if(m){ m.result=null; saveDB(); showToast('Result cleared.'); render(); }
}

// Boot
async function init() {
  // Restore logged-in session
  const savedUser = loadSession();
  if(savedUser && DB.users[savedUser]){
    currentUser = savedUser;
  }

  // Repair DB: reset if matches missing, wrong count, or timestamps are from 2025 (old bug)
  const needsReset = !DB.matches || !Array.isArray(DB.matches) || DB.matches.length === 0 ||
    DB.matches.some(m => m.ts && m.ts < 1780000000000); // 2025 timestamps are ~1749xxx
  if(needsReset) {
    // Preserve user accounts and bets, only reset matches
    DB.matches = JSON.parse(JSON.stringify(DEFAULT_MATCHES));
    saveDB();
  } else {
    // Patch any missing timestamps from newer match list
    let patched = false;
    DB.matches.forEach(m => {
      const def = DEFAULT_MATCHES.find(d => d.id === m.id);
      if(def && !m.ts) { m.ts = def.ts; patched = true; }
    });
    // Add any new matches not yet in saved DB
    DEFAULT_MATCHES.forEach(def => {
      if(!DB.matches.find(m => m.id === def.id)) {
        DB.matches.push(JSON.parse(JSON.stringify(def)));
        patched = true;
      }
    });
    if(patched) saveDB();
  }

  render();
}

init();
</script>
